<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Benchmark</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header><h1>Model benchmark</h1><nav><a href="/new">New benchmark</a> · <a href="/results">Results</a></nav></header>

  <section id="login" hidden>
    <p>Your CheckNet login has expired. Sign in again so the running benchmark can keep calling the agent.</p>
    <a class="button" id="login-link" href="/login">Log in</a>
    <p id="login-note" class="muted"></p>
  </section>

  <section id="idle" hidden>
    <p>No benchmark is running.</p>
    <a class="button" href="/new">New benchmark</a>
  </section>
  <p id="message" class="muted"></p>

  <section id="progress-box" hidden>
    <h2><span id="state"></span> <span id="run-model" class="muted"></span></h2>
    <progress id="bar" value="0" max="1"></progress>
    <div id="counts" class="muted"></div>
    <div id="mirror-note" class="skipped"></div>
    <div id="last-error" class="bad"></div>
  </section>

  <section id="current-box" hidden>
    <h2>Current request</h2>
    <div id="current"></div>
  </section>

  <section id="last-box" hidden>
    <h2>Last result</h2>
    <div id="last"></div>
  </section>

  <section id="sessions-box" hidden>
    <h2>Sessions</h2>
    <div id="sessions"></div>
  </section>
</main>
<script src="/common.js"></script>
<script>
  let current = null, currentSeenAt = 0, lastSessionsJson = "";
  setupLogin(() => poll());

  function renderCurrent() {
    $("current-box").hidden = !current;
    if (!current) return;
    const elapsed = current.elapsedMs + (Date.now() - currentSeenAt);
    $("current").innerHTML = `
      <div class="facts">
        <span>session <strong>${esc(current.label)}</strong></span>
        <span>message ${current.message + 1} of ${current.of}</span>
        <span class="mono">agent session ${esc(current.sessionId || "new")}</span>${recapTag(current)}
        <span class="running">waiting ${duration(elapsed)}</span>
      </div>
      <pre>${esc(current.question)}</pre>`;
  }

  function renderLast(last) {
    $("last-box").hidden = !last;
    if (!last) return;
    $("last").innerHTML = `
      <div class="facts"><span>session <strong>${esc(last.label)}</strong></span><span>message ${last.message + 1} of ${last.of}</span></div>
      <div class="muted">Question</div><pre>${esc(last.question)}</pre>
      ${answerBody(last)}`;
  }

  function sessionStats(messages) {
    const answered = messages.filter((m) => ANSWERED.has(m.state));
    const count = (s) => answered.filter((m) => m.state === s).length;
    const avg = answered.length ? answered.reduce((n, m) => n + m.latency_ms, 0) / answered.length : null;
    const tools = answered.reduce((n, m) => n + (m.toolCalls ?? 0), 0);
    const cost = answered.reduce((n, m) => n + (m.costUsd ?? 0), 0);
    const unsaved = messages.filter((m) => m.unsaved).length;
    const has = (s) => messages.some((m) => m.state === s);
    const state = ["running", "pending", "failed", "token-limit", "skipped"].find(has) ?? "ok";
    const skipped = messages.filter((m) => m.state === "skipped").length;
    return { answered: answered.length, ok: count("ok"), failed: count("failed"), tokenLimit: count("token-limit"), skipped, unsaved, avg, tools, cost, state };
  }

  function renderSessions(sessions) {
    const json = JSON.stringify(sessions);
    if (json === lastSessionsJson) return;
    lastSessionsJson = json;
    $("sessions-box").hidden = !sessions.length;
    $("sessions").innerHTML = sessions.map((s, si) => {
      const st = sessionStats(s.messages);
      const rows = s.messages.map((m, mi) => {
        const answered = ANSWERED.has(m.state);
        const body = answered || m.state === "skipped" ? answerBody(m) : `<div class="muted">Expected</div><pre>${esc(m.expected || "(none)")}</pre>`;
        return `<tr>
          <td>${mi + 1}</td>
          <td class="${m.state}">${ICON[m.state]} ${label(m.state)}${recapTag(m)}${m.unsaved ? ` <span class="unsaved">· not saved</span>` : ""}</td>
          <td>${details(`${si}-${mi}`, shortQuestion(m.question), `<pre>${esc(m.question)}</pre>${body}`)}</td>
          <td>${answered ? duration(m.latency_ms) : "–"}</td>
          <td>${answered ? m.toolCalls ?? 0 : "–"}</td>
        </tr>`;
      }).join("");
      const summary = `<span class="${st.state}">${ICON[st.state]}</span> ${esc(s.label)}
        <span class="stats">· ${st.answered}/${s.messages.length} answered · ${st.ok} ok · ${st.failed} failed${st.skipped ? ` · <span class="skipped">${st.skipped} skipped</span>` : ""}${st.tokenLimit ? ` · <span class="token-limit">${st.tokenLimit} token limit</span>` : ""}${st.unsaved ? ` · <span class="unsaved">${st.unsaved} not saved</span>` : ""} · avg ${duration(st.avg)} · ${st.tools} tool calls · $${st.cost.toFixed(4)}</span>`;
      const table = `<table><thead><tr><th>#</th><th>Status</th><th>Question</th><th>Latency</th><th>Tools</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="muted mono">agent session ${esc(s.agentSessionId || "–")}</div>`;
      return `<div class="session">${details(`s${si}`, summary, table)}</div>`;
    }).join("");
  }

  async function poll() {
    try {
      const { loggedIn, run } = await api("/api/status");
      const active = ["starting agent", "running"].includes(run.state);
      // Here the login matters only while a run needs it; a new run logs in on /new.
      showLogin(loggedIn || !active);
      $("idle").hidden = active;
      $("progress-box").hidden = run.state === "idle";
      $("state").textContent = run.state;
      $("run-model").textContent = run.model ? `(${run.model})` : "";
      $("bar").max = run.total || 1;
      $("bar").value = run.done;
      $("counts").textContent = `${run.done} / ${run.total} answered, ${run.failures} failed, ${run.tokenLimits ?? 0} token limit` + (run.skipped ? `, ${run.skipped} skipped` : "") + (run.unsaved ? `, ${run.unsaved} not saved` : "");
      const missing = run.mirrorMissing ?? [];
      $("mirror-note").textContent = missing.includes("GH_TOKEN")
        ? `Repo mirror not synced (${missing.join(" and ")} missing): questions that need plugin code, FDS or the Layout Designer manual are skipped; the rest still runs.`
        : missing.length
          ? "Legacy half of the repo mirror not synced (AZDO_PAT missing): questions are still asked, but the agent can't read the legacy CKP.RI.RetailerPlugIn.* code."
          : "";
      $("last-error").textContent = run.lastError;
      current = run.current;
      currentSeenAt = Date.now();
      renderCurrent();
      renderLast(run.last);
      renderSessions(run.sessions ?? []);
    } catch (err) {
      $("message").textContent = err.message;
    }
  }

  poll();
  setInterval(poll, 2000);
  setInterval(renderCurrent, 1000); // keep the waiting time ticking between polls
</script>
</body>
</html>
