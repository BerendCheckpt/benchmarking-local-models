# Publishing a GitHub release (tag vX.Y.Z) runs the tests and, only when they
# pass, builds and pushes the two images the spark stack runs:
#   ghcr.io/<owner>/benchmarking-local-models:X.Y.Z        the app
#   ghcr.io/<owner>/benchmarking-local-models-agent:X.Y.Z  the benchmark-only agent
# The agent image is the production cnu-claude-agent image plus agent/Dockerfile's
# layer. Pulling that base needs CHECKPT_GHCR_TOKEN: a token that can read the
# checkpt-als packages (read:packages).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version and image names from the release tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must look like vX.Y.Z, got ${TAG}"; exit 1
          fi
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          BASE="$(sed -n 's/^ARG AGENT_BASE=//p' agent/Dockerfile)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app=ghcr.io/${OWNER}/benchmarking-local-models" >> "$GITHUB_OUTPUT"
          echo "agent=ghcr.io/${OWNER}/benchmarking-local-models-agent" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      # One registry, two logins: pull the production agent image with the
      # checkpt-als token first, then log in as this repo to push. The plain
      # docker builder then finds the pulled base locally.
      - name: Pull the agent's base image
        env:
          CHECKPT_GHCR_TOKEN: ${{ secrets.CHECKPT_GHCR_TOKEN }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          if [ -z "$CHECKPT_GHCR_TOKEN" ]; then
            echo "::error::set the CHECKPT_GHCR_TOKEN secret (read:packages for checkpt-als)"; exit 1
          fi
          echo "$CHECKPT_GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "$BASE"
          docker logout ghcr.io

      - name: Log in to push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push the app image
        env:
          IMAGE: ${{ steps.version.outputs.app }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Build and push the benchmark agent image
        env:
          IMAGE: ${{ steps.version.outputs.agent }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build --pull=false -t "$IMAGE:$VERSION" -t "$IMAGE:latest" ./agent
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
