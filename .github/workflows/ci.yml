# Runs the test suite on every pull request and every push to main. The release
# workflow calls it too, so no image is built unless these tests pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # keep in step with the Dockerfile base image
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
