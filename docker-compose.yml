# The benchmark app only. It joins the existing postgres and claude-agent
# containers and does not manage their lifecycle (apart from recreating the
# agent with a new model).
services:
  benchmark:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:${PORT}" # page + OAuth redirect
    extra_hosts:
      - "host.docker.internal:host-gateway" # agent's published port
    # The Docker socket is root:root 0660; group 0 lets the node user open it.
    # Mounting it gives this container control over Docker on the host, which
    # is why the page is bound to 127.0.0.1 only.
    group_add:
      - "0"
    environment:
      QA_SESSIONS_SSH_KEY_FILE: /run/secrets/qa_sessions_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      # Private key for the QA sessions host, read-only. Without a key path the
      # mount is /dev/null and messages that had a file are skipped.
      - ${QA_SESSIONS_SSH_KEY_PATH:-/dev/null}:/run/secrets/qa_sessions_key:ro
    networks:
      - pg

  # Builds the agent image the app recreates claude-agent-local from. Build-only
  # (profile "agent"), so `docker compose up` never starts them:
  #   docker compose --profile agent build agent
  agent-upstream:
    profiles: ["agent"]
    image: cnu-claude-agent:local
    build: ../cnu-claude-agent
  agent:
    profiles: ["agent"]
    image: cnu-claude-agent-benchmark:latest
    build:
      context: ./agent
      additional_contexts:
        upstream: service:agent-upstream
      args:
        AGENT_ENV: ${AGENT_ENV:-qa}
        AGENT_OLLAMA_URL: ${AGENT_OLLAMA_URL:-}
        AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-42000}
        AGENT_WRAP_UP_SECONDS: ${AGENT_WRAP_UP_SECONDS:-120}

networks:
  pg:
    external: true
    name: ${PG_NETWORK:?set PG_NETWORK in .env}
