# The benchmark viewer: the page, and the uploaded reports as a JSON listing.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Read-only: the page and the reports are only ever fetched.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Everything the page needs is inline or from this server; nothing else is loaded.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # The page lists this folder (autoindex as JSON) and loads the chosen file.
    location /reports/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        types { application/json json; }
        default_type application/json;
    }
}
